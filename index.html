<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            overflow: hidden;
            color: #fff;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 25px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        }

        form {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        input[type="text"] {
            padding: 10px 15px;
            border-radius: 50px;
            border: none;
            width: 70%;
            outline: none;
            font-size: 1rem;
            transition: 0.3s ease;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        button {
            padding: 10px 20px;
            margin-left: 10px;
            border-radius: 50px;
            border: none;
            background: #ff6b6b;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background: #ff4757;
            transform: scale(1.05);
        }

        #weather {
            font-size: 1.2rem;
            padding: 20px;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: background 0.3s ease;
        }

        
        @media (max-width: 500px) {
            input[type="text"] {
                width: 60%;
            }

            button {
                padding: 10px 15px;
                font-size: 0.9rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            #weather {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Weather App</h1>

        <form onsubmit="getweather(); return false;">
            <input type="text" name="city" id="city" placeholder="Enter City Name" />
            <button type="submit">Get Weather</button>
        </form>

        <div id="weather">Enter a city to see the weather</div>
    </div>

    <script>
        async function getweather() {
            try {
                const cityRef = document.querySelector("#city");
                const city = cityRef.value;
                const weatherAPI = await fetch(
                    `https://p2pclouds.up.railway.app/v1/learn/weather?city=${city}`
                );

                const weatherRef = document.querySelector("#weather");
                const data = await weatherAPI.json();
                weatherRef.innerHTML = `${city} Feels like: ${data.current.feelslike_c}°C`;
            } catch (error) {
                alert("Error Fetching Data");
            }
        }
    </script>
</body>

</html>
